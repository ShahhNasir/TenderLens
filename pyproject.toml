
# ==================================================
# BUILD SYSTEM
# ==================================================

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"


# ==================================================
# PROJECT METADATA
# ==================================================

[project]
name = "tenderlens"
version = "0.1.0"

description = "Evidence-grounded AI tender intelligence platform"

readme = "README.md"

requires-python = ">=3.12,<3.14"

dependencies = [
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
]


# ==================================================
# DEVELOPMENT DEPENDENCIES
# ==================================================

[project.optional-dependencies]

dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]


# ==================================================
# PACKAGE BUILD CONFIGURATION
# ==================================================

[tool.hatch.build.targets.wheel]

packages = ["src/tenderlens"]


# ==================================================
# PYTEST CONFIGURATION
# ==================================================

[tool.pytest.ini_options]

testpaths = ["tests"]

python_files = ["test_*.py"]

python_functions = ["test_*"]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


# ==================================================
# RUFF: LINTING AND FORMATTING
# ==================================================

[tool.ruff]

line-length = 88

target-version = "py312"

src = ["src", "tests"]


[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]

quote-style = "double"

indent-style = "space"


# ==================================================
# MYPY: STATIC TYPE CHECKING
# ==================================================

[tool.mypy]

python_version = "3.12"

mypy_path = "src"

strict = true

warn_unused_ignores = true

warn_redundant_casts = true

no_implicit_optional = true
